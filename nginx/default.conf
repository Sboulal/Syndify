server {
    listen 80;

    location / {
        # 👈 Zidna had 2 lignes bach Nginx dima i-jib l'IP jdid dyal l'Frontend
        resolver 127.0.0.11 valid=30s;
        set $upstream_frontend syndify_frontend;
        
        proxy_pass http://$upstream_frontend:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

   location /api {
        resolver 127.0.0.11 valid=30s;
        set $upstream_backend syndify_backend;
        
        # 1. N-khedmou l'Proxy
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 2. HNA S-SER: Nginx howa li ghadi i-jme3 r-ras w y-lsseq CORS f r-rjou3
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Accept, Origin, Authorization' always;

        # 3. OPTIONS: Ila l'navigateur sawel "Wach momkin ndir request?", goul lih "Ah!" bla mat-berzt Laravel
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Accept, Origin, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}