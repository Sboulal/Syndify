<div class="flex h-screen bg-syndify-bg font-['Poppins'] overflow-hidden">

  <aside class="bg-syndify-dark text-white flex flex-col h-full relative z-50 shadow-2xl transition-all duration-300 ease-in-out overflow-visible"
         [ngClass]="isSidebarCollapsed ? 'w-[88px]' : 'w-[320px]'">
    
    <button (click)="toggleSidebar()" 
            class="absolute -right-3.5 top-10 bg-[#1B3B32] border border-white/20 rounded-full w-7 h-7 flex items-center justify-center z-[60] shadow-md cursor-pointer transition-all duration-200">
      <svg class="w-4 h-4 text-white transition-transform duration-300" 
           [ngClass]="{'rotate-180': isSidebarCollapsed}" 
           fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>

    <div class="pt-6 px-6 pb-4 flex flex-col items-center" [ngClass]="{'items-center': isSidebarCollapsed, 'items-start': !isSidebarCollapsed}">
      <div class="w-10 h-10 bg-white rounded-lg flex shrink-0 items-center justify-center mb-4 shadow-md">
        <svg class="w-6 h-6 text-syndify-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15l4-4 4 4 5-5 5 5"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21h18"></path></svg>
      </div>
      <div [class.hidden]="isSidebarCollapsed" class="transition-opacity duration-200 w-full whitespace-nowrap overflow-hidden"> <h2 class="text-sm font-bold tracking-wide truncate" [title]="residenceNom">{{ residenceNom }}</h2>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto px-4 mt-2 custom-scrollbar">
      <nav class="space-y-1">
        
        <a routerLink="/dashboard" (click)="setActive('dashboard')" class="flex items-center gap-3 py-2.5 text-sm rounded-lg transition-all cursor-pointer"
           [ngClass]="[
             isSidebarCollapsed ? 'justify-center px-0' : 'px-3',
             activeItem === 'dashboard' ? 'text-white font-medium bg-white/5' : 'text-gray-300 hover:text-white hover:bg-white/5'
           ]">
          <svg class="w-5 h-5 shrink-0" [ngClass]="{'text-syndify-accent': activeItem === 'dashboard' && isSidebarCollapsed}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          <div [class.hidden]="isSidebarCollapsed" class="flex items-center gap-1.5">
            <span class="truncate">Tableau de bord</span>
            <span *ngIf="activeItem === 'dashboard'" class="w-1.5 h-1.5 bg-syndify-accent rounded-full shrink-0"></span>
          </div>
        </a>

        <div>
          <button (click)="toggleMenu('copropriete')" class="w-full flex items-center justify-between py-2.5 text-sm rounded-lg transition-all cursor-pointer" 
                  [ngClass]="[
                    isSidebarCollapsed ? 'justify-center px-0' : 'px-3',
                    openMenus['copropriete'] && !isSidebarCollapsed ? 'text-white font-medium' : 'text-gray-300 hover:bg-white/5'
                  ]">
            <div class="flex items-center gap-3">
              <svg class="w-5 h-5 shrink-0" [ngClass]="{'text-syndify-accent': openMenus['copropriete'] && isSidebarCollapsed}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
              <div [class.hidden]="isSidebarCollapsed" class="flex items-center gap-1.5">
                <span class="truncate">Ma copropriété</span>
                <span *ngIf="openMenus['copropriete']" class="w-1.5 h-1.5 bg-syndify-accent rounded-full shrink-0"></span>
              </div>
            </div>
            <svg *ngIf="!isSidebarCollapsed" class="w-4 h-4 shrink-0 transition-transform duration-200" [ngClass]="{'rotate-180': openMenus['copropriete']}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          
          <div *ngIf="openMenus['copropriete'] && !isSidebarCollapsed" class="pl-11 pr-3 py-2 space-y-3 overflow-hidden">
            <a routerLink="/gestion-lots" (click)="setActive('gestion-lots')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'gestion-lots' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'gestion-lots'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'gestion-lots'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Gestion des biens</span>
            </a>
            <a routerLink="/liste-coproprietes" (click)="setActive('liste-copros')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'liste-copros' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'liste-copros'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'liste-copros'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Liste des copropriétaires</span>
            </a>
            <a routerLink="/cles-de-repartition" (click)="setActive('cles')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'cles' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'cles'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'cles'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Clés de répartition</span>
            </a>
            <a routerLink="/les-impayes" (click)="setActive('impayes')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'impayes' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'impayes'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'impayes'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Les impayés</span>
            </a>
          </div>
        </div>

        <div>
          <button (click)="toggleMenu('financement')" class="w-full flex items-center justify-between py-2.5 text-sm rounded-lg transition-all cursor-pointer"
                  [ngClass]="[
                    isSidebarCollapsed ? 'justify-center px-0' : 'px-3',
                    openMenus['financement'] && !isSidebarCollapsed ? 'text-white font-medium' : 'text-gray-300 hover:bg-white/5 hover:text-white'
                  ]">
            <div class="flex items-center gap-3">
              <svg class="w-5 h-5 shrink-0" [ngClass]="{'text-syndify-accent': openMenus['financement'] && isSidebarCollapsed}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
              <div [class.hidden]="isSidebarCollapsed" class="flex items-center gap-1.5">
                <span class="truncate">Financement</span>
                <span *ngIf="openMenus['financement']" class="w-1.5 h-1.5 bg-syndify-accent rounded-full shrink-0"></span>
              </div>
            </div>
            <svg *ngIf="!isSidebarCollapsed" class="w-4 h-4 shrink-0 transition-transform duration-200" [ngClass]="{'rotate-180': openMenus['financement']}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>

          <div *ngIf="openMenus['financement'] && !isSidebarCollapsed" class="pl-11 pr-3 py-2 space-y-3 overflow-hidden">
            <a routerLink="/budgets-depenses" (click)="setActive('budgets-depenses')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'budgets-depenses' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'budgets-depenses'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'budgets-depenses'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Budgets & dépenses</span>
            </a>
            <a routerLink="/appels-de-fonds" (click)="setActive('appels-de-fonds')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'appels-de-fonds' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'appels-de-fonds'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'appels-de-fonds'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Appels de fonds</span>
            </a>
            <a routerLink="/simulation-budget" (click)="setActive('simulation-budget')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'simulation-budget' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'simulation-budget'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'simulation-budget'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Simuler un budget</span>
            </a>
          </div>
        </div>

            <div>
          <button (click)="toggleMenu('Exercice & clôtures')" class="w-full flex items-center justify-between py-2.5 text-sm rounded-lg transition-all cursor-pointer"
                  [ngClass]="[
                    isSidebarCollapsed ? 'justify-center px-0' : 'px-3',
                    openMenus['Exercice & clôtures'] && !isSidebarCollapsed ? 'text-white font-medium' : 'text-gray-300 hover:bg-white/5 hover:text-white'
                  ]">
            <div class="flex items-center gap-3">
              <svg class="w-5 h-5 shrink-0" [ngClass]="{'text-syndify-accent': openMenus['Exercice & clôtures'] && isSidebarCollapsed}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6h13M9 10h6m-6 0V3m6 7v6M4 19h.01M4 10h.01M4 3h.01"></path></svg>
              <div [class.hidden]="isSidebarCollapsed" class="flex items-center gap-1.5">
                <span class="truncate">Exercice & clôtures</span>
                <span *ngIf="openMenus['Exercice & clôtures']" class="w-1.5 h-1.5 bg-syndify-accent rounded-full shrink-0"></span>
              </div>
            </div>
            <svg *ngIf="!isSidebarCollapsed" class="w-4 h-4 shrink-0 transition-transform duration-200" [ngClass]="{'rotate-180': openMenus['Exercice & clôtures']}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>

          <div *ngIf="openMenus['Exercice & clôtures'] && !isSidebarCollapsed" class="pl-11 pr-3 py-2 space-y-3 overflow-hidden">
            <a routerLink="/exercice" (click)="setActive('exercice')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'exercice' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'exercice'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'exercice'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Exercice</span>
            </a>
            <a routerLink="/exercices/cloture/:id" (click)="setActive('cloture')" class="flex items-center gap-3 text-[13px] transition-colors cursor-pointer" [ngClass]="activeItem === 'cloture' ? 'text-syndify-accent font-medium' : 'text-gray-400 hover:text-gray-200'">
              <svg *ngIf="activeItem === 'cloture'" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="activeItem !== 'cloture'" class="w-3.5 h-3.5 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="4"></circle></svg>
              <span class="truncate">Clôtures</span>
            </a>
           
          </div>
        </div>

        
        <a href="#" class="flex items-center gap-3 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-white/5 rounded-lg transition-all"
           [ngClass]="isSidebarCollapsed ? 'justify-center px-0' : 'px-3'">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
          <span [class.hidden]="isSidebarCollapsed" class="relative truncate">
            Documents
          </span>
        </a>
      </nav>
    </div>

    <div class="p-6 mt-auto whitespace-nowrap" [ngClass]="{'text-center': isSidebarCollapsed}">
      <p [class.hidden]="isSidebarCollapsed" class="text-xs font-bold text-white mb-1">Version actuelle</p>
      <p [class.hidden]="isSidebarCollapsed" class="text-[11px] text-gray-400 truncate">1.12.42 - <a href="#" class="text-syndify-accent hover:underline">voir les notes</a></p>
      <span *ngIf="isSidebarCollapsed" class="text-[10px] font-bold text-gray-500">v1.12</span>
    </div>

  </aside>

  <main class="flex-1 overflow-y-auto relative bg-syndify-bg flex flex-col z-10">
    <router-outlet></router-outlet>
  </main>

</div>
